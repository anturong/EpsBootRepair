; ============================================================
; EPS Boot Repair Tool -- English language pack
; Encoding must be UTF-8 (BOM optional)
; Only change the right-hand side of "="; keep section and key names as-is
; {0} {1} are placeholders -- reorder freely, but do not delete them
; To add a language: copy this file to <language>.ini and keep the keys
; ============================================================

[App]
Title=EPS Boot Repair
VersionLabel=Version

[Main]
EnvSection=Select the Windows system partition
SysPartitionLabel=Windows system partition
EspLabel=ESP partition (detected)
EspNone=No ESP partition on this disk
EspLine=Disk {0} partition {1} | {2}
ActionLabel=Actions
LogLabel=Log
WarningLabel=Warning
NoSelection=No system partition selected yet.

[Partition]
Gpt=GPT
Mbr=MBR
Unknown=Unknown
ListRow=Disk {0} | Partition {1} | {2} | {3}

[Button]
Refresh=Refresh
Repair=Rebuild ESP
OpenLog=Open log folder

[Warning]
Ok=Environment looks fine. Repair is available.
SelectedEsp=The selection is the ESP partition itself, not a Windows system partition. Pick the partition that contains Windows.
NoEsp=This disk has no ESP partition, so there is nothing to write to.
SystemPartitionNoWindows=The selected partition has no Windows\System32. bcdboot uses it as the source to copy boot files from, so the repair cannot succeed (exit code 193 or 0x80092003). Pick the partition that contains Windows.

[Confirm]
Destructive=This will write boot files into the ESP partition and may affect existing boot entries. Continue?

[Error]
NoAdmin=This tool must run as administrator. Right-click and choose "Run as administrator".
NoTools=No usable boot repair tools found (bcdboot / diskpart).
NoSystemPartition=No Windows system partition selected.
CommandFailed=Command failed with exit code {0}: {1}
ToolMissing=Tool not found: {0}
Timeout=Command timed out and was killed: {0}
NoFreeLetter=No free drive letter available to assign to this partition.
BadPartition=Cannot resolve the disk/partition number for: {0}
NoEspOnDisk=Disk {0} has no ESP partition. Nothing to repair.

[Done]
Success=Repair completed.
Failed=Errors occurred during repair. Check the log.

[Log]
Start=Started, detecting environment
ScanningPartitions=Enumerating disks and partitions...
PartitionRow=Disk {0} | Partition {1} | {2} | Style {3}
SystemPartitionSelected=System partition selected: {0}
EspFound=ESP partition found: disk {1} partition {2} ({0})
EspAssigned=Assigned drive letter to ESP: {0}
LetterMountFailed=Could not mount the drive letter directly (error {0}); falling back to diskpart
LetterAssigned=Assigned drive letter to partition: {0}
ToolSource=Using tool: {0} ({1})
ToolSourceSystem=system built-in
ToolSourceBundled=bundled
Arch=Target architecture: {0}
Running=Running: {0}
Finished=All steps finished, exit code {0}
Exit=exit code {0}: {1}
SourceNoWindows=The selected partition {0} has no Windows\System32, so bcdboot has no source to copy from and will most likely fail.
BcdbootNoSource=bcdboot exited with {0} (193=ERROR_BAD_EXE_FORMAT, 0x80092003=CRYPT_E_FILE_ERROR): the boot files it needs to read are not there. Check that the selected system partition really holds Windows (Windows\Boot\EFI\bootmgfw.efi), then that the ESP is readable and writable.
NoWindowsFound=No partition contains Windows\System32. This does not block repair: pick a partition and it will be written; bcdboot may just fail because of it.

[Status]
Ready=Ready
Working=Working...
