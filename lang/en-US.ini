; ============================================================
; EPS Boot Repair Tool -- English language pack
; Encoding must be UTF-8 (BOM optional)
; Only change the right-hand side of "="; keep section and key names as-is
; {0} {1} are placeholders -- reorder freely, but do not delete them
; To add a language: copy this file to <language>.ini and keep the keys
; ============================================================

