BcdbootNoSource=bcdboot exited with {0} (193=ERROR_BAD_EXE_FORMAT, 0x80092003=CRYPT_E_FILE_ERROR): the boot files it needs to read are not there. Check that the selected system partition really holds Windows (Windows\Boot\EFI\bootmgfw.efi), then that the ESP is readable and writable.
NoWindowsFound=No partition contains Windows\System32. This does not block repair: pick a partition and it will be written; bcdboot may just fail because of it.
