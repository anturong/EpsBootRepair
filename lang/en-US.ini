[Advanced]
Title=Advanced repair: choose partitions by hand
Tip=Pick the source and the target separately. The target is a disk: choose one and the boot partition is derived from it. The boot mode follows that partition -- an ESP means UEFI, an MBR partition means Legacy BIOS. Nothing is pre-selected and nothing is guessed for you.
SourceLabel=Source: Windows system partition
TargetLabel=Target: disk (boot partition derived)
PartLabel=This disk has several candidates; pick the one to write to
PreviewLabel=Will run
NeedBoth=Select both the source and the target disk first.
LetterPending=(letter not assigned yet)
NoSourceCandidates=No partition can serve as the source.
NoTargetCandidates=No disk can serve as the boot target (none has an ESP or an MBR partition).
NoCandidateOnDisk=This disk has no partition usable as a boot target (ESP or MBR partition), so it cannot be picked.

[Target]
KindEsp=GPT ESP
KindGptFat=GPT FAT (probably an ESP)
KindMbrActive=MBR active partition
KindMbrInactive=MBR inactive
Row=Partition {0} | {1} | {2}

[Disk]
Row=HD{0}:{1}({2})
RowKind=HD{0}:{1}({2}) |{3}
UnknownModel=unknown model
KindEsp=EPS
KindMbr=MBR
KindCount={0}x{1}

[Warning]
Ok=Environment looks fine. Repair is available.
SelectedEsp=The selection is the ESP partition itself, not a Windows system partition. Pick the partition that contains Windows.
NoEsp=This disk has no ESP partition, so there is nothing to write to.
MultipleActivePartition=More than one active primary partition on this disk, so it is unclear which one to write to. Leave exactly one active partition and try again.
NoActivePartition=No partition on this disk is marked active, so the boot files will be written to the selected partition itself. Legacy boot needs that partition marked active and this tool does not write the partition table -- if it will not boot, mark it active with a partition tool.
SystemPartitionNoWindows=The selected partition has no Windows\System32. bcdboot uses it as the source to copy boot files from, so the repair cannot succeed (exit code 193 or 0x80092003). Pick the partition that contains Windows.
AdvancedInactiveTarget=The target partition is not marked active. Legacy boot requires that mark and this tool does not write the partition table -- the files will be written anyway, but it may not boot; mark it active with a partition tool afterwards.

[Confirm]
Destructive=This will write boot files into the ESP partition and may affect existing boot entries. Continue?
DestructiveMbr=This will write boot files into the disk's active primary partition and write boot code into its volume boot sector and the disk MBR, which may affect existing boot entries. Continue?
DestructiveAdvanced=About to run an advanced repair.
Source: {0}
Target: {1}
Command: {2}
This may affect existing boot entries. Continue?
AdvancedYesTitle=Advanced repair: final confirmation
AdvancedTypeYes=Second confirmation. Type YES and click OK to start the repair.
AdvancedWrongToken=That was not YES, so nothing was started. Type YES exactly to continue.

[Error]
NoAdmin=This tool must run as administrator. Right-click and choose "Run as administrator".
NoTools=No usable boot repair tools found (bcdboot / diskpart).
NoSystemPartition=No Windows system partition selected.
CommandFailed=Command failed with exit code {0}: {1}
ToolMissing=Tool not found: {0}
Timeout=Command timed out and was killed: {0}
NoFreeLetter=No free drive letter available to assign to this partition.
BadPartition=Cannot resolve the disk/partition number for: {0}
NoEspOnDisk=Disk {0} has no ESP partition. Nothing to repair.
NoBootPartition=Disk {0} has more than one active primary partition; cannot tell which one to write to.

[Done]
Success=Repair completed.
Failed=Errors occurred during repair. Check the log.

