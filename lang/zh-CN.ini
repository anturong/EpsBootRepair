; ============================================================
; EPS 引导修复工具 —— 简体中文语言包
; 编码必须是 UTF-8（带不带 BOM 都行）
; 只改 = 右边的值；[] 段名和 = 左边的键名不要动
; 值里的 {0} {1} 是占位符，顺序可调换，但不能删
; 加新语言：复制本文件改名成 <语言>.ini，键名保持一致
; ============================================================

[App]
Title=EPS 引导修复工具
VersionLabel=版本

[Main]
EnvSection=选择 Windows 系统分区
SysPartitionLabel=Windows 系统分区
EspLabel=ESP 分区（自动识别）
EspNone=该盘上没有 ESP 分区
EspLine=磁盘 {0} 分区 {1}｜{2}
BootLabel=引导分区（自动识别）
BootNone=该盘上没有活动的主分区
BootLine=磁盘 {0} 分区 {1}｜{2}
ActionLabel=操作
LogLabel=执行日志
WarningLabel=警告
NoSelection=尚未选择系统分区。

[Partition]
Gpt=GPT
Mbr=MBR
Unknown=未知
ListRow=磁盘 {0} | 分区 {1} | {2} | {3}

[Button]
Refresh=刷新
Repair=一键修复 ESP
RepairMbr=一键修复引导
OpenLog=打开日志目录

[Warning]
Ok=环境检查通过，可以执行修复。
SelectedEsp=现在选中的是 ESP 分区本身，不是 Windows 系统分区。请在列表里选含 Windows 的那个分区。
NoEsp=所选分区所在磁盘上没有 ESP 分区，无法修复。
MultipleActivePartition=该盘上有多个活动主分区，无法确定该把引导文件写到哪一个。请只保留一个活动分区后重试。
NoActivePartition=该盘上没有标为活动的分区，引导文件会直接写在所选分区上。Legacy 引导要求这个分区带活动标记，而本工具不写分区表——若装完开不了机，请用分区工具把它标为活动。
SystemPartitionNoWindows=所选分区里没有 Windows\System32。bcdboot 要拿它当源来复制引导文件，这样修必然失败（退出码 193 或 0x80092003）。请选含 Windows 的那个分区。

[Confirm]
Destructive=即将往 ESP 分区写入引导文件，可能影响现有启动项。确认继续？
DestructiveMbr=即将往该盘的活动主分区写入引导文件，并把引导代码写进它的分区引导扇区和磁盘 MBR，可能影响现有启动项。确认继续？

[Error]
NoAdmin=本程序必须以管理员身份运行。请右键“以管理员身份运行”后重试。
NoTools=找不到可用的引导修复工具（bcdboot / diskpart）。
NoSystemPartition=没有选择 Windows 系统分区。
CommandFailed=命令执行失败，退出码 {0}：{1}
ToolMissing=找不到工具：{0}
Timeout=命令执行超时，已强制结束：{0}
NoFreeLetter=找不到可用的空闲盘符，无法为该分区分配盘符。
BadPartition=无法定位该分区所属的磁盘号/分区号：{0}
NoEspOnDisk=磁盘 {0} 上没有 ESP 分区，无法修复。
NoBootPartition=磁盘 {0} 上有多个活动主分区，无法确定该写哪一个，无法修复。

[Done]
Success=修复完成。
Failed=修复过程中出现错误，请查看日志。

[Log]
Start=程序启动，开始检测环境
ScanningPartitions=正在枚举磁盘分区……
PartitionRow=磁盘 {0} | 分区 {1} | {2} | 分区表 {3}
SystemPartitionSelected=已选择系统分区：{0}
EspFound=发现 ESP 分区：磁盘 {1} 分区 {2}（{0}）
BootPartFound=发现引导分区：磁盘 {1} 分区 {2}（{0}）
EspAssigned=已为 ESP 分区分配盘符：{0}
LetterMountFailed=直接挂载盘符失败（错误 {0}），回退用 diskpart
LetterAssigned=已为分区分配盘符：{0}
ToolSource=使用工具：{0}（{1}）
ToolSourceSystem=系统自带
ToolSourceBundled=项目内置
Arch=目标架构：{0}
Running=正在执行：{0}
Finished=全部步骤结束，退出码 {0}
Exit=退出码 {0}：{1}
SourceNoWindows=所选分区 {0} 里没有 Windows\System32：bcdboot 没有源可以复制，步进到它多半会报错。
BcdbootNoSource=bcdboot 退出码 {0}（193=ERROR_BAD_EXE_FORMAT，0x80092003=CRYPT_E_FILE_ERROR）：它要读的引导文件不在。先确认所选“系统分区”里真的有 Windows（有 Windows\Boot\EFI\bootmgfw.efi），再看 ESP 能不能正常读写。
NoWindowsFound=没有任何分区含 Windows\System32。不影响修复：选好分区就直接写，只是 bcdboot 可能因此报错。

[Status]
Ready=就绪
Working=处理中……
