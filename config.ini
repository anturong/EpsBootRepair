; ============================================================
; EPS 引导修复工具 —— 主配置
; 编码必须是 UTF-8
; 这一份是"程序行为"配置；界面文字一律在 lang\*.ini 里，别往这儿塞
; ============================================================

[General]
; 界面语言。可选 zh-CN / en-US，其余语言包按 lang\<名字>.ini 放进来即可
Language=zh-CN

[Tools]
; 1 = 一律用项目内置 tools\ 下的 exe（推荐）
; 0 = 先探系统自带 %SystemRoot%\System32，缺失才回退到项目内置
;
; 默认 1 是实测定的：PE 常把系统工具精简掉或换成壳，USM 系统总裁 PE 的
; X:\windows\system32\bcdboot.exe 直接以退出码 193（ERROR_BAD_EXE_FORMAT）退出，
; 一键修复于是永远修不动。内嵌的是官方原版、版本固定，比"最配当前 PE"更可信。
; 内置的缺失（比如 tools\ 被删）会自动回退到系统自带，所以设 1 不会更脆。
PreferBundled=1

[Log]
; 捕获工具 stdout/stderr 用的代码页。PE 中文乱码时改这个（936=GBK，65001=UTF-8）
CodePage=936

; 日志目录。留空 = 自动：先试程序自己所在目录的 logs\（光盘上写不进就跳过），
; 再退到 %TEMP%\eps-logs。PE 的 %TEMP% 是内存盘，一重启日志就没了 ——
; 想留存就写死一个真盘/U 盘路径，例如 Dir=E:\eps-log
Dir=

[Esp]
; 给 ESP 分区分配盘符时先试的字母，留空 = 从 Z 往前自动找
PreferredLetter=
